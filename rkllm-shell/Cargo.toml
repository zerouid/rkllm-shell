[package]
name = "rkllm-shell"
version = "0.1.0"
edition = "2021"

[dependencies]
hf-hub = "0.3"
axum = "0.8.4"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.39", features = ["derive"] }
config = "0.15.11"
directories = "6.0.0"
log = { version = "0.4.27", features = ["std"] }
owo-colors = { version = "4.2.1", features = ["supports-colors"] }
rkllm-api-sys = { workspace = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["raw_value"] }
thiserror = "2.0.12"
tokio = { version = "1", features = ["full"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "macros"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
utoipa-axum = "0.2"
clap-repl = { version = "0.3.2", features = ["async"] }
reqwest = { workspace = true, features = ["json"]}
sha2 = "0.10"
tokio-stream = "0.1"
futures = "0.3"
image = "0.25"
base64 = "0.22"
anyhow = "1.0"
schemars = "1.0"
# rig framework for AI agents
rig = { version = "0.41", features = ["agent", "memory", "sqlite", "derive"] }
rig-core = { version = "0.41", features = ["derive"] }
# Test infrastructure dependencies
async-trait = "0.1"
httpmock = "0.7"
tempfile = "3.8"
proptest = "1.0"
tokio-test = "0.4"
wiremock = "0.5"
axum-test = "21"

[dev-dependencies]
